# Compila el APK en la nube cada vez que se sube código a main.
# El resultado (APK + registro de la compilación) queda en la rama "salida".
name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar y probar
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publicar en la rama salida
        if: always()
        run: |
          mkdir -p /tmp/salida
          cp build.log /tmp/salida/ 2>/dev/null || true
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/salida/GafasClaude.apk 2>/dev/null || true
          if [ -f /tmp/salida/GafasClaude.apk ]; then echo ok > /tmp/salida/estado.txt; else echo fallo > /tmp/salida/estado.txt; fi
          echo "${{ github.sha }}" > /tmp/salida/commit.txt
          cd /tmp/salida
          git init -q -b salida
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Compilación ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" salida
